[package]
name = "onyx"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"
nvml-wrapper = "0.10"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
chrono = "0.4.45"
command-group = { version = "5.0.1", features = ["with-tokio"] }
gguf = "0.1.2"
gguf-rs = "0.1.8"

[build-dependencies]
winres = "0.1"
